[project]
name = "sonic_explorer"
version = "0.1.0"
description = "Audio-signal-based music similarity, exploration, and remix engine."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "faiss-cpu",
    "plotly",
    "streamlit",
    "pandas",
    "anthropic",
    "networkx",
    # librosa/soundfile: NOT just a colab/dev extra anymore -- Approach's
    # waveform-preview step (analysis/waveform_preview.py) loads real audio
    # at runtime in the deployed app itself, unlike the rest of the base
    # dependencies, which only ever read precomputed artifacts. soundfile's
    # pip wheel bundles its own libsndfile with MP3 decode support built in
    # (verified: soundfile 0.14.0 / libsndfile 1.2.2 report "MP3" in
    # available_formats() and successfully decode a real deploy_data clip),
    # so no system-level ffmpeg/apt package is needed on Streamlit Cloud.
    "librosa",
    "soundfile",
    # Also NOT just a colab/dev extra anymore -- the Engineering page's live
    # CNN genre-classifier picker (analysis/genre_cnn.py's SmallGenreCNN)
    # loads real trained weights and runs real inference in the deployed
    # app itself. Permanently increases deployed install size/boot time --
    # an explicit, accepted trade-off for a live rather than static demo.
    "torch",
]

[project.optional-dependencies]
colab = [
    "torchaudio",
    "transformers",
    "accelerate",
    "demucs",
]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sonic_explorer*"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Exploratory, throwaway by design (see spec section 4.2's "workflow
# narrative": notebooks are for fast exploration, promoted code is what
# gets held to a bar) -- not worth linting to the same standard as the
# package/app/scripts.
exclude = ["notebooks"]

[tool.ruff.lint]
# Deliberately narrow: catches real bugs (unused imports/vars, undefined
# names) without relitigating this codebase's existing style (long lines in
# docstrings, comment-heavy rationale) via a full default rule set.
select = ["E9", "F", "B"]
ignore = ["F401"]  # re-exports and lazily-imported optional deps (torch/demucs) trip this legitimately

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]  # fixtures assigned-and-unused are a common, harmless pytest pattern
